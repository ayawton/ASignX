text-anchor="middle" font-size="13" fill="#526581">Transactional SQL / locks / constraints</text><path d="M1040 1200V1340H435V1490" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="455" text-anchor="start" font-size="13" fill="#18294C"><tspan x="455" y="1370">Private HTTP with X-Recognition-Key</tspan><tspan x="455" y="1390">Session frames, capabilities and NLP requests/results</tspan></text><path d="M435 1590V1610H255V1650" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="105" text-anchor="start" font-size="12" fill="#18294C"><tspan x="105" y="1628">JPEG decoding and landmarks</tspan></text><path d="M420 1715H450" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="437" text-anchor="middle" font-size="10" fill="#18294C"><tspan x="437" y="1640">features</tspan></text><path d="M780 1540H795V1900H780" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M435 2040V2150" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="455" text-anchor="start" font-size="13" fill="#18294C"><tspan x="455" y="2100">Read local assets</tspan></text><path d="M1080 1630V1700" fill="none" stroke="#526581" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1095" text-anchor="start" font-size="11" fill="#18294C"><tspan x="1095" y="1670">Identity/profile</tspan></text><rect x="90" y="280" width="550" height="160" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M98 280H632Q640 280 640 288V324H90V288Q90 280 98 280" fill="#EDF3FF"/><text x="108" text-anchor="start" font-size="17" fill="#18294C"><tspan x="108" y="308">React workspace</tspan></text><text x="108" text-anchor="start" font-size="14" fill="#18294C"><tspan x="108" y="353">Public catalog and introductory samples</tspan><tspan x="108" y="374">Enrollment, lesson flow, results and progress</tspan><tspan x="108" y="395">Admin authoring/imports; Sign Strike demo</tspan></text><rect x="700" y="280" width="530" height="160" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M708 280H1222Q1230 280 1230 288V324H700V288Q700 280 708 280" fill="#EDF3FF"/><text x="718" text-anchor="start" font-size="17" fill="#18294C"><tspan x="718" y="308">Camera and frame stream</tspan></text><text x="718" text-anchor="start" font-size="14" fill="#18294C"><tspan x="718" y="353">MediaDevices -&gt; resized JPEG frames</tspan><tspan x="718" y="374">One active request plus newest pending frame</tspan><tspan x="718" y="395">Used by ASignLive and learner camera answers</tspan></text><rect x="90" y="480" width="550" height="100" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M98 480H632Q640 480 640 488V524H90V488Q90 480 98 480" fill="#EDF3FF"/><text x="108" text-anchor="start" font-size="17" fill="#18294C"><tspan x="108" y="508">Supabase JS client</tspan></text><text x="108" text-anchor="start" font-size="13" fill="#18294C"><tspan x="108" y="553">Accounts, session refresh and permitted sign media</tspan></text><rect x="700" y="480" width="530" height="100" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M708 480H1222Q1230 480 1230 488V524H700V488Q700 480 708 480" fill="#EDF3FF"/><text x="718" text-anchor="start" font-size="17" fill="#18294C"><tspan x="718" y="508">Live text composition</tspan></text><text x="718" text-anchor="start" font-size="13" fill="#18294C"><tspan x="718" y="553">Letters -&gt; provisional words -&gt; formatted sentences</tspan></text><rect x="90" y="790" width="1140" height="90" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M98 790H1222Q1230 790 1230 798V834H90V798Q90 790 98 790" fill="#EDF3FF"/><text x="108" text-anchor="start" font-size="17" fill="#18294C"><tspan x="108" y="818">Request boundary</tspan></text><text x="108" text-anchor="start" font-size="13" fill="#18294C"><tspan x="108" y="863">Input validation and request limits; Supabase identity, current roles and ownership checks on protected routes</tspan></text><rect x="90" y="950" width="330" height="180" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M98 950H412Q420 950 420 958V994H90V958Q90 950 98 950" fill="#EDF3FF"/><text x="108" text-anchor="start" font-size="17" fill="#18294C"><tspan x="108" y="978">Learner routes</tspan></text><text x="108" text-anchor="start" font-size="13" fill="#18294C"><tspan x="108" y="1023">Enrollments and lesson material</tspan><tspan x="108" y="1043">Profiles, results and progress</tspan><tspan x="108" y="1063">Runs, grading, hearts and XP</tspan><tspan x="108" y="1083">Heart-practice restoration</tspan></text><rect x="450" y="950" width="360" height="180" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M458 950H802Q810 950 810 958V994H450V958Q450 950 458 950" fill="#EDF3FF"/><text x="468" text-anchor="start" font-size="17" fill="#18294C"><tspan x="468" y="978">Admin authoring</tspan></text><text x="468" text-anchor="start" font-size="13" fill="#18294C"><tspan x="468" y="1023">Courses, graphics, signs and media</tspan><tspan x="468" y="1043">Lessons, questions and validation</tspan><tspan x="468" y="1063">Text preview/import; batched writes</tspan><tspan x="468" y="1083">Publish, archive and draft copy</tspan></text><rect x="855" y="950" width="375" height="250" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M863 950H1222Q1230 950 1230 958V994H855V958Q855 950 863 950" fill="#EDF3FF"/><text x="873" text-anchor="start" font-size="17" fill="#18294C"><tspan x="873" y="978">Recognition gateway</tspan></text><text x="873" text-anchor="start" font-size="13" fill="#18294C"><tspan x="873" y="1023">Public ASignLive session routes</tspan><tspan x="873" y="1043">Learner/run-bound camera sessions</tspan><tspan x="873" y="1063">Word and sentence assistance routes</tspan><tspan x="873" y="1083">Private service key and request limits</tspan><tspan x="873" y="1103">Trusted grade persistence</tspan><tspan x="873" y="1123">Opaque session mapping and expiry</tspan></text><rect x="90" y="1160" width="720" height="80" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M98 1160H802Q810 1160 810 1168V1204H90V1168Q90 1160 98 1160" fill="#EDF3FF"/><text x="108" text-anchor="start" font-size="17" fill="#18294C"><tspan x="108" y="1188">Data access</tspan></text><text x="108" text-anchor="start" font-size="12" fill="#18294C"><tspan x="108" y="1233">Postgres.js SQL connection pool; Drizzle schema and migration definitions</tspan></text><rect x="90" y="1490" width="690" height="100" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M98 1490H772Q780 1490 780 1498V1534H90V1498Q90 1490 98 1490" fill="#EDF3FF"/><text x="108" text-anchor="start" font-size="17" fill="#18294C"><tspan x="108" y="1518">FastAPI boundary and session registry</tspan></text><text x="108" text-anchor="start" font-size="13" fill="#18294C"><tspan x="108" y="1563">Service-key checks, opaque sessions, expiry and per-session CPU state</tspan></text><rect x="90" y="1650" width="330" height="140" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M98 1650H412Q420 1650 420 1658V1694H90V1658Q90 1650 98 1650" fill="#EDF3FF"/><text x="108" text-anchor="start" font-size="17" fill="#18294C"><tspan x="108" y="1678">MediaPipe HandLandmarker</tspan></text><text x="108" text-anchor="start" font-size="12" fill="#18294C"><tspan x="108" y="1723">Decode images and extract landmarks</tspan><tspan x="108" y="1742">Prepare static / temporal features</tspan><tspan x="108" y="1761">Track hand state per session</tspan></text><rect x="450" y="1650" width="330" height="140" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M458 1650H772Q780 1650 780 1658V1694H450V1658Q450 1650 458 1650" fill="#EDF3FF"/><text x="468" text-anchor="start" font-size="17" fill="#18294C"><tspan x="468" y="1678">ONNX Runtime CPU</tspan></text><text x="468" text-anchor="start" font-size="12" fill="#18294C"><tspan x="468" y="1723">Static and sequence classifiers</tspan><tspan x="468" y="1742">Confidence and stabilized emissions</tspan><tspan x="468" y="1761">Loaded classifier metadata</tspan></text><rect x="90" y="1850" width="690" height="130" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M98 1850H772Q780 1850 780 1858V1894H90V1858Q90 1850 98 1850" fill="#EDF3FF"/><text x="108" text-anchor="start" font-size="17" fill="#18294C"><tspan x="108" y="1878">SymSpell</tspan></text><text x="108" text-anchor="start" font-size="13" fill="#18294C"><tspan x="108" y="1923">Word matching and sentence segmentation</tspan><tspan x="108" y="1943">Private NLP endpoints receive letter groups and provisional text</tspan></text><rect x="60" y="2150" width="750" height="150" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M68 2150H802Q810 2150 810 2158V2194H60V2158Q60 2150 68 2150" fill="#EDF3FF"/><text x="78" text-anchor="start" font-size="17" fill="#18294C"><tspan x="78" y="2178">Local private model assets</tspan></text><text x="78" text-anchor="start" font-size="14" fill="#18294C"><tspan x="78" y="2223">server/private/models/asignx/*.onnx + classifier metadata JSON</tspan><tspan x="78" y="2244">server/private/models/mediapipe/hand_landmarker.task</tspan><tspan x="78" y="2265">Loaded by the Python recognition process</tspan></text><rect x="925" y="1490" width="310" height="140" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M933 1490H1227Q1235 1490 1235 1498V1534H925V1498Q925 1490 933 1490" fill="#EDF3FF"/><text x="943" text-anchor="start" font-size="17" fill="#18294C"><tspan x="943" y="1518">Supabase Auth</tspan></text><text x="943" text-anchor="start" font-size="13" fill="#18294C"><tspan x="943" y="1563">Email confirmation and login</tspan><tspan x="943" y="1583">Recovery and session refresh</tspan><tspan x="943" y="1603">Access-token verification</tspan></text><rect x="925" y="1700" width="310" height="240" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M933 1700H1227Q1235 1700 1235 1708V1744H925V1708Q925 1700 933 1700" fill="#EDF3FF"/><text x="943" text-anchor="start" font-size="17" fill="#18294C"><tspan x="943" y="1728">PostgreSQL</tspan></text><text x="943" text-anchor="start" font-size="13" fill="#18294C"><tspan x="943" y="1773">23 application tables</tspan><tspan x="943" y="1793">auth.users; object metadata</tspan><tspan x="943" y="1813">RLS and integrity constraints</tspan><tspan x="943" y="1833">Grading and validation triggers</tspan><tspan x="943" y="1853">Atomic hearts / XP updates</tspan><tspan x="943" y="1873">Server-side permissions</tspan></text><rect x="925" y="2050" width="310" height="180" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M933 2050H1227Q1235 2050 1235 2058V2094H925V2058Q925 2050 933 2050" fill="#EDF3FF"/><text x="943" text-anchor="start" font-size="17" fill="#18294C"><tspan x="943" y="2078">Supabase Storage</tspan></text><text x="943" text-anchor="start" font-size="12" fill="#18294C"><tspan x="943" y="2123">Private learning-media bucket</tspan><tspan x="943" y="2142">Curated sign MP4 demonstrations</tspan><tspan x="943" y="2161">Admin writes under policies</tspan><tspan x="943" y="2180">Time-limited signed playback</tspan></text><rect x="60" y="2350" width="1200" height="105" rx="8" fill="#F8FAFD" stroke="#DFE7F3"/><text x="78" text-anchor="start" font-size="13" fill="#18294C"><tspan x="78" y="2378">The browser sends JPEGs through Express. MediaPipe extraction and ONNX inference run in the private Python process.</tspan><tspan x="78" y="2398">Frame processing and Live session text use memory. Lesson attempts and XP persist through authenticated server transactions.</tspan><tspan x="78" y="2418">Local topology: Vite 5173 proxies /api and /health to Express 3000; the recognition launcher binds to 127.0.0.1:8001.</tspan></text></g></svg>