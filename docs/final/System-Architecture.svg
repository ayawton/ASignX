<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1600" viewBox="0 0 1280 1600"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M1 1L9 5L1 9" fill="none" stroke="#526581" stroke-width="1.5"/></marker></defs><rect width="1280" height="1600" fill="white"/><g font-family="Arial,sans-serif" fill="#18294C"><text x="640" y="38" font-size="26" text-anchor="middle">ASignX - System architecture</text><text x="640" y="62" font-size="13" text-anchor="middle" fill="#60718B">Current source - 5 November 2026</text><rect x="800" y="510" width="370" height="690" rx="12" fill="#F8FAFD" stroke="#AFC5ED" stroke-width="1.4"/><text x="818" text-anchor="start" font-size="19" fill="#18294C"><tspan x="818" y="541">Supabase</tspan></text><path d="M600 180V240" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="615" text-anchor="start" font-size="13" fill="#18294C"><tspan x="615" y="212">Use application</tspan></text><path d="M390 440V490H350V560" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="405" text-anchor="start" font-size="13" fill="#18294C"><tspan x="405" y="488">/api requests and responses</tspan><tspan x="405" y="508">JWT on protected routes</tspan></text><path d="M900 320H985V580" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="1002" text-anchor="start" font-size="13" fill="#18294C"><tspan x="1002" y="410">Accounts and</tspan><tspan x="1002" y="430">session refresh</tspan></text><path d="M900 400H1220V1085H1140" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text transform="translate(1243 780) rotate(-90)" text-anchor="middle" font-size="13" fill="#526581">Signed video playback / admin MP4 uploads</text><path d="M640 620H740V645H830" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="678" text-anchor="start" font-size="12" fill="#18294C"><tspan x="678" y="598">Verify token</tspan></text><path d="M640 725H740V835H830" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="655" text-anchor="start" font-size="12" fill="#18294C"><tspan x="655" y="802">Transactional SQL</tspan></text><path d="M350 780V960" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="369" text-anchor="start" font-size="13" fill="#18294C"><tspan x="369" y="846">Private HTTP + service key</tspan><tspan x="369" y="866">JPEG frames / recognition results</tspan><tspan x="369" y="886">Letter text / NLP assistance</tspan></text><path d="M985 710V765" fill="none" stroke="#526581" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arrow)"/><text x="1001" text-anchor="start" font-size="11" fill="#18294C"><tspan x="1001" y="741">Identity/profile</tspan></text><path d="M350 1185V1310" fill="none" stroke="#526581" stroke-width="1.5" marker-end="url(#arrow)"/><text x="369" text-anchor="start" font-size="13" fill="#18294C"><tspan x="369" y="1250">Read local model files</tspan></text><rect x="420" y="95" width="360" height="85" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M428 95H772Q780 95 780 103V139H420V103Q420 95 428 95" fill="#EDF3FF"/><text x="438" text-anchor="start" font-size="17" fill="#18294C"><tspan x="438" y="123">People</tspan></text><text x="438" text-anchor="start" font-size="14" fill="#18294C"><tspan x="438" y="168">Guest, learner, administrator</tspan></text><rect x="260" y="240" width="640" height="200" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M268 240H892Q900 240 900 248V284H260V248Q260 240 268 240" fill="#EDF3FF"/><text x="278" text-anchor="start" font-size="17" fill="#18294C"><tspan x="278" y="268">Web browser - React + Vite</tspan></text><text x="278" text-anchor="start" font-size="15" fill="#18294C"><tspan x="278" y="313">ASignLive, ASign Learn and administration</tspan><tspan x="278" y="335">Camera JPEG capture and Live text composition</tspan><tspan x="278" y="357">Sign Strike simulated/keyboard demo</tspan><tspan x="278" y="379">Supabase client for accounts and sign media</tspan></text><rect x="60" y="560" width="580" height="220" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M68 560H632Q640 560 640 568V604H60V568Q60 560 68 560" fill="#EDF3FF"/><text x="78" text-anchor="start" font-size="17" fill="#18294C"><tspan x="78" y="588">Application API - Express + TypeScript</tspan></text><text x="78" text-anchor="start" font-size="15" fill="#18294C"><tspan x="78" y="633">Identity, current roles and ownership checks</tspan><tspan x="78" y="655">Learning, imports, hearts and XP transactions</tspan><tspan x="78" y="677">Private recognition gateway</tspan><tspan x="78" y="699">Postgres.js connection pool and Drizzle schema</tspan></text><rect x="60" y="960" width="580" height="225" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M68 960H632Q640 960 640 968V1004H60V968Q60 960 68 960" fill="#EDF3FF"/><text x="78" text-anchor="start" font-size="17" fill="#18294C"><tspan x="78" y="988">Private recognition - Python + FastAPI</tspan></text><text x="78" text-anchor="start" font-size="15" fill="#18294C"><tspan x="78" y="1033">MediaPipe hand landmarks and temporal features</tspan><tspan x="78" y="1055">Static / sequence ONNX Runtime inference</tspan><tspan x="78" y="1077">Stabilized sign labels and confidence</tspan><tspan x="78" y="1099">SymSpell word and sentence assistance</tspan></text><rect x="60" y="1310" width="580" height="145" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M68 1310H632Q640 1310 640 1318V1354H60V1318Q60 1310 68 1310" fill="#EDF3FF"/><text x="78" text-anchor="start" font-size="17" fill="#18294C"><tspan x="78" y="1338">Local private assets</tspan></text><text x="78" text-anchor="start" font-size="14" fill="#18294C"><tspan x="78" y="1383">server/private/models</tspan><tspan x="78" y="1404">ONNX classifiers, metadata and hand_landmarker.task</tspan></text><rect x="830" y="580" width="310" height="130" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M838 580H1132Q1140 580 1140 588V624H830V588Q830 580 838 580" fill="#EDF3FF"/><text x="848" text-anchor="start" font-size="17" fill="#18294C"><tspan x="848" y="608">Auth</tspan></text><text x="848" text-anchor="start" font-size="13" fill="#18294C"><tspan x="848" y="653">Accounts and access tokens</tspan><tspan x="848" y="673">Email confirmation and recovery</tspan></text><rect x="830" y="765" width="310" height="175" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M838 765H1132Q1140 765 1140 773V809H830V773Q830 765 838 765" fill="#EDF3FF"/><text x="848" text-anchor="start" font-size="17" fill="#18294C"><tspan x="848" y="793">PostgreSQL</tspan></text><text x="848" text-anchor="start" font-size="13" fill="#18294C"><tspan x="848" y="838">23 application tables</tspan><tspan x="848" y="858">Managed identity and object metadata</tspan><tspan x="848" y="878">RLS, constraints and grading triggers</tspan><tspan x="848" y="898">Atomic learning / authoring writes</tspan></text><rect x="830" y="1000" width="310" height="155" rx="8" fill="#FFFFFF" stroke="#AFC5ED" stroke-width="1.5"/><path d="M838 1000H1132Q1140 1000 1140 1008V1044H830V1008Q830 1000 838 1000" fill="#EDF3FF"/><text x="848" text-anchor="start" font-size="17" fill="#18294C"><tspan x="848" y="1028">Storage</tspan></text><text x="848" text-anchor="start" font-size="13" fill="#18294C"><tspan x="848" y="1073">Private learning-media bucket</tspan><tspan x="848" y="1093">Curated sign MP4 demonstrations</tspan><tspan x="848" y="1113">Policy-checked upload and playback</tspan></text><rect x="60" y="1500" width="1110" height="77" rx="8" fill="#F8FAFD" stroke="#DFE7F3"/><text x="78" text-anchor="start" font-size="13" fill="#18294C"><tspan x="78" y="1528">Camera frames and Live session text are held in memory. Lesson outcomes persist in PostgreSQL; curated videos persist in Storage.</tspan><tspan x="78" y="1548">Local development connections use Vite 5173, Express 3000 and the private Python service at 127.0.0.1:8001.</tspan></text></g></svg>