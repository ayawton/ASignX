<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><rect width="1920" height="1080" fill="white"/><g font-family="Arial, sans-serif"><text x="120" y="119" font-size="29" font-weight="700" fill="#4984c5">ASignX</text><text x="120" y="208" font-size="66" font-weight="700" fill="#1c2030">System Workflow</text><g text-anchor="middle"><rect x="120" y="440" width="400" height="265" rx="26" fill="#f5f7fa"/><text x="320" y="498" font-size="40" font-weight="700" fill="#4984c5">01</text><text x="320" y="544" font-size="31" font-weight="700" fill="#1c2030">Login</text><text x="320" y="591" font-size="25" fill="#515c70" dy="0">Register and verify email.</text><text x="320" y="591" font-size="25" fill="#515c70" dy="34">Sign in as learner or admin.</text><path d="M 526 574 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#aebdce" stroke-width="2.5"/><rect x="550" y="440" width="400" height="265" rx="26" fill="#f5f7fa"/><text x="750" y="498" font-size="40" font-weight="700" fill="#4984c5">02</text><text x="750" y="544" font-size="31" font-weight="700" fill="#1c2030">Input</text><text x="750" y="591" font-size="25" fill="#515c70" dy="0">Choose lessons and answer</text><text x="750" y="591" font-size="25" fill="#515c70" dy="34">questions or perform signs.</text><text x="750" y="591" font-size="25" fill="#515c70" dy="68">Admins create course content.</text><path d="M 956 574 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#aebdce" stroke-width="2.5"/><rect x="980" y="440" width="400" height="265" rx="26" fill="#f5f7fa"/><text x="1180" y="498" font-size="40" font-weight="700" fill="#4984c5">03</text><text x="1180" y="544" font-size="31" font-weight="700" fill="#1c2030">Process</text><text x="1180" y="591" font-size="25" fill="#515c70" dy="0">Validate access and responses.</text><text x="1180" y="591" font-size="25" fill="#515c70" dy="34">Grade answers, recognize signs</text><text x="1180" y="591" font-size="25" fill="#515c70" dy="68">and save learning activity.</text><path d="M 1386 574 h 18 m -7 -7 l 7 7 -7 7" fill="none" stroke="#aebdce" stroke-width="2.5"/><rect x="1410" y="440" width="400" height="265" rx="26" fill="#f5f7fa"/><text x="1610" y="498" font-size="40" font-weight="700" fill="#4984c5">04</text><text x="1610" y="544" font-size="31" font-weight="700" fill="#1c2030">Output</text><text x="1610" y="591" font-size="25" fill="#515c70" dy="0">Display answer feedback,</text><text x="1610" y="591" font-size="25" fill="#515c70" dy="34">recognized text, hearts, XP</text><text x="1610" y="591" font-size="25" fill="#515c70" dy="68">and course progress.</text></g><text x="120" y="862" font-size="23" fill="#697487">Guest access: explore public previews and ASignLive without an account.</text><text x="120" y="902" font-size="23" fill="#697487">Learners repeat lessons to improve their skills and track their progress.</text><text x="1800" y="1000" text-anchor="end" font-size="23" fill="#697487">Login → Input → Process → Output</text></g></svg>