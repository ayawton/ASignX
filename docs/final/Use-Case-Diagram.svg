<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1740" viewBox="0 0 1440 1740"><defs><marker id="open" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#61728B" stroke-width="1.4"/></marker></defs><rect width="1440" height="1740" fill="white"/><g font-family="Arial, sans-serif" fill="#18294C"><text x="720" y="42" text-anchor="middle" font-size="27">ASignX - Use case diagram</text><rect x="24" y="220" width="1392" height="1300" rx="12" fill="none" stroke="#AFC5ED" stroke-width="1.5"/><text x="720" y="249" text-anchor="middle" font-size="20">ASignX</text><g stroke="#18294C" stroke-width="2" fill="none"><circle cx="264" cy="91" r="13"/><path d="M264 104V143 M241 120H287 M264 143L246 167 M264 143L282 167"/></g><text x="264" y="190" text-anchor="middle" font-size="18" font-weight="bold">Visitor</text><text x="264" y="208" text-anchor="middle" font-size="11">Guest or signed-in user</text><rect x="48" y="270" width="432" height="1215" rx="9" fill="#FFFFFF" stroke="#DFE7F3"/><text x="264" y="305" text-anchor="middle" font-size="18">Public access</text><path d="M237 159 H60 V370 H90" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="264" cy="370" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="264" text-anchor="middle" font-size="15"><tspan x="264" y="375">Browse published courses</tspan></text><path d="M237 159 H60 V496 H90" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="264" cy="496" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="264" text-anchor="middle" font-size="15"><tspan x="264" y="491">Try introductory sample</tspan><tspan x="264" y="511">lessons</tspan></text><path d="M237 159 H60 V622 H90" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="264" cy="622" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="264" text-anchor="middle" font-size="15"><tspan x="264" y="627">Register and confirm email</tspan></text><path d="M237 159 H60 V748 H90" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="264" cy="748" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="264" text-anchor="middle" font-size="15"><tspan x="264" y="753">Log in</tspan></text><path d="M237 159 H60 V874 H90" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="264" cy="874" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="264" text-anchor="middle" font-size="15"><tspan x="264" y="879">Recover account password</tspan></text><path d="M237 159 H60 V1000 H90" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="264" cy="1000" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="264" text-anchor="middle" font-size="15"><tspan x="264" y="995">Recognize letters with</tspan><tspan x="264" y="1015">ASignLive</tspan></text><path d="M237 159 H60 V1126 H90" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="264" cy="1126" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="264" text-anchor="middle" font-size="15"><tspan x="264" y="1131">Play Sign Strike demo</tspan></text><g stroke="#18294C" stroke-width="2" fill="none"><circle cx="728" cy="91" r="13"/><path d="M728 104V143 M705 120H751 M728 143L710 167 M728 143L746 167"/></g><text x="728" y="190" text-anchor="middle" font-size="18" font-weight="bold">Learner</text><text x="728" y="208" text-anchor="middle" font-size="11">Confirmed learner account</text><rect x="512" y="270" width="432" height="1215" rx="9" fill="#FFFFFF" stroke="#DFE7F3"/><text x="728" y="305" text-anchor="middle" font-size="18">Learning workspace</text><path d="M701 159 H524 V370 H554" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="728" cy="370" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="375">View personal dashboard</tspan></text><path d="M701 159 H524 V496 H554" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="728" cy="496" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="501">Enroll in a published course</tspan></text><path d="M701 159 H524 V622 H554" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="728" cy="622" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="627">View enrolled learning path</tspan></text><path d="M701 159 H524 V748 H554" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="728" cy="748" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="743">Study lesson material and</tspan><tspan x="728" y="763">videos</tspan></text><path d="M701 159 H524 V874 H554" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="728" cy="874" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="879">Answer graded lesson exercises</tspan></text><ellipse cx="728" cy="1000" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="995">Answer using camera</tspan><tspan x="728" y="1015">recognition</tspan></text><path d="M701 159 H524 V1126 H554" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="728" cy="1126" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="1121">Restore a heart through</tspan><tspan x="728" y="1141">practice</tspan></text><path d="M701 159 H524 V1252 H554" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="728" cy="1252" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="1247">Review results, XP and</tspan><tspan x="728" y="1267">progress</tspan></text><path d="M701 159 H524 V1378 H554" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="728" cy="1378" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="728" text-anchor="middle" font-size="15"><tspan x="728" y="1383">Manage personal profile</tspan></text><g stroke="#18294C" stroke-width="2" fill="none"><circle cx="1192" cy="91" r="13"/><path d="M1192 104V143 M1169 120H1215 M1192 143L1174 167 M1192 143L1210 167"/></g><text x="1192" y="190" text-anchor="middle" font-size="18" font-weight="bold">Administrator</text><text x="1192" y="208" text-anchor="middle" font-size="11">Confirmed admin account</text><rect x="976" y="270" width="432" height="1215" rx="9" fill="#FFFFFF" stroke="#DFE7F3"/><text x="1192" y="305" text-anchor="middle" font-size="18">Administration</text><path d="M1165 159 H988 V370 H1018" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="1192" cy="370" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="1192" text-anchor="middle" font-size="15"><tspan x="1192" y="375">View system overview</tspan></text><path d="M1165 159 H988 V496 H1018" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="1192" cy="496" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="1192" text-anchor="middle" font-size="15"><tspan x="1192" y="491">Create or edit course and</tspan><tspan x="1192" y="511">graphic</tspan></text><path d="M1165 159 H988 V622 H1018" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="1192" cy="622" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="1192" text-anchor="middle" font-size="15"><tspan x="1192" y="617">Author lessons and question</tspan><tspan x="1192" y="637">types</tspan></text><path d="M1165 159 H988 V748 H1018" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="1192" cy="748" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="1192" text-anchor="middle" font-size="15"><tspan x="1192" y="743">Import course or lessons from</tspan><tspan x="1192" y="763">text</tspan></text><ellipse cx="1192" cy="874" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="1192" text-anchor="middle" font-size="15"><tspan x="1192" y="869">Validate and preview text</tspan><tspan x="1192" y="889">import</tspan></text><path d="M1165 159 H988 V1000 H1018" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="1192" cy="1000" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="1192" text-anchor="middle" font-size="15"><tspan x="1192" y="995">Publish, archive or copy</tspan><tspan x="1192" y="1015">courses</tspan></text><path d="M1165 159 H988 V1126 H1018" fill="none" stroke="#8291A8" stroke-width="1.2"/><ellipse cx="1192" cy="1126" rx="174" ry="39" fill="#F7FAFF" stroke="#AFC5ED" stroke-width="1.4"/><text x="1192" text-anchor="middle" font-size="15"><tspan x="1192" y="1131">Manage signs and demo videos</tspan></text><path d="M728 961V913" fill="none" stroke="#61728B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="737" y="937" font-size="12">&lt;&lt;extend&gt;&gt;</text><path d="M1192 787V835" fill="none" stroke="#61728B" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#open)"/><text x="1201" y="811" font-size="12">&lt;&lt;include&gt;&gt;</text><path d="M1219 159 H1404 V1378 H902" fill="none" stroke="#8291A8" stroke-width="1.2"/><rect x="48" y="1550" width="1344" height="145" rx="8" fill="#F8FAFD" stroke="#DFE7F3"/><text x="72" y="1581" dy="0" font-size="14">Visitor covers public URLs for both guests and signed-in users. Learner/admin roles require confirmed accounts.</text><text x="72" y="1581" dy="28" font-size="14">Camera recognition is conditional on the question type. Grading and rewards are saved by the backend.</text><text x="72" y="1581" dy="56" font-size="14">Heart practice restores one heart after three correct familiar answers. Sign Strike uses simulated or keyboard input.</text><text x="72" y="1581" dy="84" font-size="14">ASignLive text stays in browser memory. Importing creates drafts; publishing makes course content available.</text></g></svg>